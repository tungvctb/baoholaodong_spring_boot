<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>App Fragment</title>
</head>
<body>
<!-- Default Navigator -->
<ul th:fragment="nav-default">
    <li><a th:href="@{/}">Home</a></li>
    <li><a th:href="@{/products}">Products</a></li>
    <li><a th:href="@{/about}">About</a></li>
</ul>




<!-- Admin Navigator -->
<ul th:fragment="nav-admin">
    <li><a th:href="@{/admin/products}">Product Management</a></li>
    <li><a th:href="@{/admin/orders}">Order Management</a></li>
</ul>

<div th:fragment="header-admin">
    <h1>This is header</h1>
</div>


<!--Footer-->
<div th:fragment="copyright">
    &copy; o7planning.org
</div>

<!--Tiny MCE-->
<div th:fragment="TinyMCE" id="TinyMCE">
    <script type="text/javascript"
            src='https://cdn.tiny.cloud/1/hrbaibq7hoewj5ixeqday9q4a2zjrxslotlqt7pf8xikj79u/tinymce/7/tinymce.min.js'
            referrerpolicy="origin">
    </script>
    <script>
        tinymce.init({
            selector: '#myTextarea',

            width: '100%',
            height: 300,
            plugins: [
                'advlist', 'autolink', 'link', 'image', 'lists', 'charmap', 'preview', 'anchor', 'pagebreak',
                'searchreplace', 'wordcount', 'visualblocks', 'visualchars', 'code', 'fullscreen', 'insertdatetime',
                'media', 'table', 'emoticons', 'help'
            ],
            toolbar: 'undo redo | styles | bold italic | alignleft aligncenter alignright alignjustify | ' +
                'bullist numlist outdent indent | link image | print preview media fullscreen | ' +
                'forecolor backcolor emoticons | help',
            menu: {
                favs: { title: 'My Favorites', items: 'code visualaid | searchreplace | emoticons' }
            },
            menubar: 'favs file edit view insert format tools table help',
            // content_css: '/Content/css/content.css'
        });
    </script>
</div>
</body>
</html>
