<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/_layoutAdmin ::main-fragment (
                        ~{:: title},
                        ~{:: #create-static-resource},
                        ~{:: #create-main-content},
                        ~{:: #create-static-resource-end},
                        ~{:: #TinyMCE}
       )}"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- Link bootstrap-->
    <link rel="preconnect" href="https://cdn.jsdelivr.net"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <title>Manu-facture</title>
    <th:block id="create-static-resource">
        <!--        Khu vực để link Css, JavaScript ở đầu trang index.html-->
        <!--    Nếu cần, còn không thì bỏ trống-->
    </th:block>
</head>
<body>
<div id="create-main-content">
    <h1>Creat Manufacture</h1>
    <form action="/admin/manu-facture/create" method="post" th:object="${manufacture}">
        <div class="form-group">
            <label for="name">name</label>
            <input class="form-control" type="text" name="name" id="name" placeholder="Name Manufacture"
                   th:field="*{name}">
        </div>

        <div class="form-group">
            <label for="myTextarea">description</label>
            <textarea class="form-control" type="text" name="description" id="description" rows="3"
                      placeholder="Description" th:field="*{description}"></textarea>-->
            <textarea id="myTextarea" name="description" th:field="*{description}"></textarea>
        </div>
        <input class="btn btn-success" type="submit" value="Create">

    </form>
</div>

<th:block id="create-static-resource-end">
    <!--        Khu vực để link Css, JavaScript ở cuối  trang index.html-->
    <!--    Nếu cần, còn không thì bỏ trống-->
</th:block>

<!--Tiny MCE-->
<div id="TinyMCE" th:replace="~{/fragments/app-fragment ::TinyMCE}">
</div>
</body>
</html>
