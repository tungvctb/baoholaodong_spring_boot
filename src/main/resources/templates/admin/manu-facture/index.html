<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/_layoutAdmin ::main-fragment (
                        ~{:: title},
                        ~{:: #index-static-resource},
                        ~{:: #index-main-content},
                        ~{:: #index-static-resource-end},
                        ~{:: #TinyMCE}
       )}"
>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Link bootstrap-->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <title>Manu-facture</title>
    <th:block id="index-static-resource">
        <!--        Khu vực để link Css, JavaScript ở đầu trang index.html-->
        <!--    Nếu cần, còn không thì bỏ trống-->
        <link rel="stylesheet" type="text/css" href="/css/admin_index.css">
    </th:block>
</head>
<body>
<div id="index-main-content">
    <h1>Manufacture Management</h1>
    <div class="d-flex justify-content-between my-2">
        <a class="btn btn-primary" href="/admin/manu-facture/create">Create Manufacturer</a>
        <a class="btn btn-danger"  href="">Recycle bin</a>
    </div>
    <table class="table table-bordered">
        <thead class="table table-dark">
        <tr class="text-center">
            <td >STT</td>
            <td>Name</td>
            <td>Description</td>
            <td>Create At</td>
            <td>Update AT</td>
            <td>Action</td>

        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${manufactures}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.name}"></td>
            <td th:utext="${item.description}"></td>
            <td th:text="${item.getCreateAt()}"></td>
            <td th:text="${item.getCreateAt()}"></td>
            <td class="d-flex gap-2 justify-content-around">
                <a class="btn btn-warning" href="#!" th:href="@{/admin/manu-facture/detail/{id}(id=${item.id})}">Detail</a>
                <a class="btn btn-success" href="#!" th:href="@{/admin/manu-facture/edit/{id}(id=${item.id})}">Edit</a>
                <form class="d-flex" href="#!" th:action="@{/admin/manu-facture/delete/{id}(id=${item.id})}" method="post" onClick="return confirm('Ban co chac chan muon xoa hay khong?')">
                    <button class="btn btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<th:block id="index-static-resource-end">
    <!--        Khu vực để link Css, JavaScript ở cuối  trang index.html-->
    <!--    Nếu cần, còn không thì bỏ trống-->

</th:block>
<div id="TinyMCE">
</div>
</body>
</html>
